# Daily upstream sync (oklabs-forks platform template, instantiated for t3code).
#
# Identity invariant (do not change):
#  - branch `upstream` is pushed with the AUTOMATIC token (doer=ActionsUser =>
#    triggers no workflows, ever) and with --force (mirror semantics);
#  - branch `main` is pushed with the bot PAT (org secret OKLABS_BOT_PAT) so
#    the push DOES trigger build.yml (recursion guard exempts real users only).
#  - no credentials persisted in git config (manual fetch below, token only
#    ever appears in one-shot fetch/push URLs).
#
# t3code delta vs the template: checkout@v4 is NOT used. Upstream vendors
# .repos/alchemy-effect with a nested 160000 gitlink that has no .gitmodules
# URL; the action's "Removing auth" phase (git submodule foreach --recursive)
# hard-fails on it under persist-credentials: false — every sync 2026-08-14..18
# died inside checkout before the sync script ran. A plain fetch never runs
# submodule commands. Same gotcha documented in build.yml.
name: sync

on:
  schedule:
    - cron: "07 6 * * *" # after handy/tolaria/ferdium morning wave
  workflow_dispatch:

env:
  UPSTREAM_URL: https://github.com/pingdotgg/t3code.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch fork (full history, no checkout action)
        run: |
          git init -b main .
          git remote add origin "https://git.oklabs.uk/${GITHUB_REPOSITORY}.git"
          git fetch "https://x-access-token:${GITHUB_TOKEN}@git.oklabs.uk/${GITHUB_REPOSITORY}.git" \
            '+refs/heads/*:refs/remotes/origin/*' --tags
          git checkout -B main origin/main

      - name: Sync upstream branch and rebase main
        env:
          OKLABS_BOT_PAT: ${{ secrets.OKLABS_BOT_PAT }}
        run: |
          git config user.name  'OK Labs'
          git config user.email 'oleg@befeast.com'
          mkdir -p /tmp/no-hooks && git config core.hooksPath /tmp/no-hooks
          export HUSKY=0 CI=true

          git fetch origin '+refs/heads/upstream:refs/remotes/origin/upstream' || true
          OLD=$(git rev-parse origin/upstream 2>/dev/null || echo none)
          git remote add github "$UPSTREAM_URL"
          git fetch github "$UPSTREAM_BRANCH" --tags
          NEW=$(git rev-parse FETCH_HEAD)
          echo "upstream: $OLD -> $NEW"
          [ "$OLD" = "$NEW" ] && { echo "no upstream changes"; exit 0; }

          git push --force "https://x-access-token:${GITHUB_TOKEN}@git.oklabs.uk/${GITHUB_REPOSITORY}.git" "$NEW:refs/heads/upstream"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@git.oklabs.uk/${GITHUB_REPOSITORY}.git" --tags || true

          MAIN_OLD=$(git rev-parse origin/main)
          git checkout -B main origin/main
          git rebase "$NEW" main

          git push --force-with-lease=refs/heads/main:"$MAIN_OLD" \
            "https://oklabs-bot:${OKLABS_BOT_PAT}@git.oklabs.uk/${GITHUB_REPOSITORY}.git" main

      # Telegram is the channel that actually reaches a human; the ntfy topic
      # has no subscriber and is kept only because the oklabs-forks template
      # uses it. This is the EARLIEST possible signal — it fires at 06:07 on
      # the morning the rebase breaks, whereas the sindri heartbeat needs
      # ~14h of accumulated lag to notice. Both sends swallow their exit code
      # so a notification outage can never fail the job, and both print their
      # HTTP status so the run log says whether delivery actually happened.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="t3code sync FAILED — fork main stops advancing until this is resolved. Usually a rebase conflict: resolve in a worktree (runbook gotcha 10). ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions"
          curl -s -H 'Priority: urgent' -d "$MSG" https://ntfy.oklabs.uk/oklabs-forks || true
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}" || echo 000)
            echo "telegram sendMessage -> ${code}"
          else
            echo "telegram secrets absent — skipped"
          fi
