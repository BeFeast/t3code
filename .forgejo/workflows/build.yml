# Build the OK Labs T3 Code AppImage, wrap it in a .deb, publish the .deb to
# the org apt repo, and publish the matching server tarball to the generic
# registry. Desktop and server MUST share the same VERSION string (T3 compares
# them byte-for-byte). Mechanics replicate t3code-oklabs-update +
# t3code-oklabs-publish-server — see the vault runbook t3code-oklabs-build.md.
#
# Gotchas baked in (do not "simplify" away):
#  - Node 24.13.1 + pnpm 11.10.0 (engines / packageManager). System node 22
#    is not enough;
#  - stamp 4 package.json files via update-release-package-versions.ts
#    ( --build-version only brands the artifact; handshake version comes
#    from the bundled package.json);
#  - do not use npm publish / npm pack for the server tarball;
#  - generic registry keeps +oklabs.* verbatim (npm registry would strip it);
#  - no `| head` / `grep -q` on pipes (SIGPIPE=141 under pipefail);
#  - container = SAME Ubuntu as the fleet (26.04);
#  - `vp` is not on PATH after pnpm install. Put node_modules/.bin on
#    GITHUB_PATH (run 99: bare `vp` missing; run 101: build script
#    `spawn vp ENOENT`). Same as t3code-oklabs-update.
#  - subtree-vendored `.repos/alchemy-effect` has a 160000 gitlink
#    with no root `.gitmodules` URL. checkout@v4 post `git submodule
#    foreach` warns (harmless). persist-credentials: false turns that
#    into a hard error (run 100). Leave the gitlink alone.
#  - Forgejo injects GITHUB_TOKEN / GITHUB_REPOSITORY. electron-builder
#    then auto-detects a GitHub publish provider and crashes in
#    computeChannelNames (null.channel) after the AppImage is built
#    (run 103). Blank those vars for the build step (buildEnv drops
#    empty strings). The OK Labs patch already returns no publish feed.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      canary:
        description: Build artifacts only on ci-interactive; never publish packages
        type: boolean
        default: false
      canary_sha:
        description: Exact 40-character source commit required for a canary
        type: string
        required: false

concurrency:
  # Artifact-only canaries cannot publish and must not delay the production lane.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.canary == true && 'canary' || 'build' }}-${{ github.repository }}
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  HUSKY: "0"
  CI: "true"
  NODE_VERSION: "24.13.1"
  PNPM_VERSION: "11.10.0"
  NODE_OPTIONS: "--max-old-space-size=4096"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  RUST_VERSION: "1.98.1"
  CARGO_BUILD_JOBS: "4"
  RAYON_NUM_THREADS: "4"
  RUST_TEST_THREADS: "2"
  CANARY: ${{ github.event_name == 'workflow_dispatch' && inputs.canary == true }}

jobs:
  build-deb:
    # Production stays on baldr until the artifact-only canary is reviewed.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.canary == true && 'ci-interactive' || 'ubuntu-latest' }}
    timeout-minutes: 90
    container:
      image: docker.io/library/ubuntu:26.04@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03
    steps:
      - name: Validate canary source
        env:
          CANARY_SHA: ${{ inputs.canary_sha }}
        run: |
          if [ "$CANARY" = true ]; then
            [[ "$CANARY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "canary_sha must be an exact lowercase 40-character commit SHA"; exit 1;
            }
          fi

      - name: Prep container (node for JS actions)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs ca-certificates curl git jq xz-utils python3 python3-yaml \
            build-essential pkg-config libsecret-1-dev file \
            fakeroot squashfs-tools imagemagick \
            libfuse2t64
          command -v node

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          submodules: false

      - name: Preserve reviewed CI helpers and select exact canary source
        env:
          CANARY_SHA: ${{ inputs.canary_sha }}
        run: |
          mkdir -p /tmp/t3-ci-helpers
          cp .oklabs/release-pair.py .oklabs/publish-server.sh .oklabs/ci-resource-receipt.py /tmp/t3-ci-helpers/
          if [ "$CANARY" = true ]; then
            git fetch origin "$CANARY_SHA"
            git checkout --detach "$CANARY_SHA"
            test "$(git rev-parse HEAD)" = "$CANARY_SHA"
          fi

      - name: Install Node 24.13.1 + pnpm 11.10.0 + Rust
        run: |
          curl -fsSL --retry 3 -o /tmp/node.tar.xz \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-gnu

      - name: Cache pnpm / cargo / electron (best effort)
        uses: https://code.forgejo.org/actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/electron
            ~/.cache/electron-builder
            native/resource-monitor/target
          key: t3code-build-linux-x64-ubuntu26.04-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-rust${{ env.RUST_VERSION }}-release-${{ hashFiles('pnpm-lock.yaml', 'native/resource-monitor/Cargo.lock') }}
          restore-keys: |
            t3code-build-linux-x64-ubuntu26.04-node${{ env.NODE_VERSION }}-pnpm${{ env.PNPM_VERSION }}-rust${{ env.RUST_VERSION }}-release-

      - name: Version stamp (committer date — monotonic, rebuild-idempotent)
        run: |
          git config --global --add safe.directory "$(pwd)" || true
          mkdir -p /tmp/no-hooks
          git config core.hooksPath /tmp/no-hooks
          BASE=$(git tag --sort=-creatordate | awk 'NR==1{print; exit}')
          BASE=${BASE#v}
          test -n "$BASE"
          STAMP=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M HEAD)
          SHA7=$(git rev-parse --short=7 HEAD)
          echo "OKLABS_VERSION=${BASE}+oklabs.${STAMP}.${SHA7}" >> "$GITHUB_ENV"
          echo "version: ${BASE}+oklabs.${STAMP}.${SHA7}"

      - name: Install JS deps + ensure electron
        run: |
          git config core.hooksPath /tmp/no-hooks
          pnpm install --frozen-lockfile
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          command -v vp
          pnpm exec vp run --filter @t3tools/desktop ensure:electron

      - name: Stamp package.json versions and build AppImage
        env:
          # Blank, not unset: build-desktop-artifact copies process.env and
          # deletes empty values before spawning electron-builder.
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_REPOSITORY: ""
        run: |
          git config core.hooksPath /tmp/no-hooks
          export PATH="$(pwd)/node_modules/.bin:${HOME}/.cargo/bin:${PATH}"
          command -v vp
          command -v cargo
          RELEASE_PKG_FILES=(apps/server/package.json apps/desktop/package.json
            apps/web/package.json packages/contracts/package.json)
          cleanup() { git checkout -q -- "${RELEASE_PKG_FILES[@]}" 2>/dev/null || true; }
          trap cleanup EXIT
          node scripts/update-release-package-versions.ts "$OKLABS_VERSION"
          rm -rf release
          node scripts/build-desktop-artifact.ts --platform linux --target AppImage --arch x64 \
            --build-version "$OKLABS_VERSION"
          APPIMG=$(ls -1t release/*.AppImage | awk 'NR==1{print; exit}')
          test -n "$APPIMG" && test -f "$APPIMG"
          echo "APPIMAGE=$APPIMG" >> "$GITHUB_ENV"
          test -x native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor

      - name: Wrap AppImage in .deb
        run: |
          chmod +x .oklabs/build-deb.sh .oklabs/t3-code .oklabs/publish-server.sh
          .oklabs/build-deb.sh "$OKLABS_VERSION" "$APPIMAGE"
          dpkg-deb --field build/t3code_*.deb Package Version Architecture Depends
          VER=$(dpkg-deb -f build/t3code_*.deb Version)
          [ "$VER" = "$OKLABS_VERSION" ] || { echo "deb Version $VER != $OKLABS_VERSION"; exit 1; }
          dpkg-deb -c build/t3code_*.deb | grep -F opt/t3code/T3-Code.AppImage
          dpkg-deb -c build/t3code_*.deb | grep -F usr/share/oklabs/t3code/install.yml
          dpkg-deb -c build/t3code_*.deb | grep -F opt/t3code/.oklabs-managed

      - name: Upload desktop artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: t3code-deb-ubuntu-26.04
          path: build/t3code_*.deb

      - name: Pack matching server artifact without publication credentials
        env:
          VERSION: ${{ env.OKLABS_VERSION }}
          PUBLISH_SERVER: "false"
        run: bash /tmp/t3-ci-helpers/publish-server.sh

      - name: Upload server tarball artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: t3-server-tarball
          path: build/t3-*.tgz

      - name: Check publication eligibility
        run: python3 /tmp/t3-ci-helpers/release-pair.py eligible

      - name: Publish .deb to org apt repo
        if: env.PUBLISH_ELIGIBLE == 'true'
        env:
          OKLABS_BOT_PAT: ${{ secrets.OKLABS_BOT_PAT }}
        run: |
          DEB=$(ls build/t3code_*.deb)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --user "oklabs-bot:${OKLABS_BOT_PAT}" \
            --upload-file "$DEB" \
            https://git.oklabs.uk/api/packages/BeFeast/debian/pool/resolute/main/upload)
          case "$CODE" in
            201) echo "published" ;;
            409) echo "already published (idempotent skip)" ;;
            *)   echo "upload failed: $CODE"; exit 1 ;;
          esac
          VER=$(dpkg-deb -f "$DEB" Version)
          for i in 1 2 3 4 5 6; do
            curl -s -o /tmp/Packages \
              https://git.oklabs.uk/api/packages/BeFeast/debian/dists/resolute/main/binary-amd64/Packages || true
            grep -F "Version: $VER" /tmp/Packages && {
              # Record what actually shipped: the failure alert must not guess.
              echo "DEB_PUBLISHED=1" >>"$GITHUB_ENV"
              exit 0
            }
            sleep 10
          done
          echo "version $VER not visible in apt index"
          exit 1

      - name: Publish server tarball (same VERSION)
        if: env.PUBLISH_ELIGIBLE == 'true'
        env:
          OKLABS_BOT_PAT: ${{ secrets.OKLABS_BOT_PAT }}
          VERSION: ${{ env.OKLABS_VERSION }}
        run: |
          bash /tmp/t3-ci-helpers/publish-server.sh
          echo "SERVER_PUBLISHED=1" >>"$GITHUB_ENV"

      - name: Publish complete release receipt
        if: env.PUBLISH_ELIGIBLE == 'true'
        env:
          OKLABS_BOT_PAT: ${{ secrets.OKLABS_BOT_PAT }}
        run: python3 /tmp/t3-ci-helpers/release-pair.py publish

      # Quality gate that REPORTS but never BLOCKS (decision 2026-08-22).
      # Until now this workflow ran no lint, no typecheck and no tests at all,
      # so "green build" only ever meant "the artifact linked" — an upstream
      # lint rule landed on 2026-08-19 that three OK Labs files violated and
      # two builds went green over it. A fork with no second reviewer must not
      # have its .deb stopped by a style rule, so this runs AFTER publishing:
      # delivery speed is untouched, and every command swallows its exit code
      # so the job cannot fail here and mis-fire the "build FAILED" alert
      # below. Tests are scoped to web+desktop — the fork's whole patch
      # surface — because the server suite wants infrastructure this container
      # does not have, and a false alert trains you to ignore real ones.
      - name: Quality checks (non-blocking)
        run: |
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          failed=""
          pnpm run lint      >/tmp/q-lint.log      2>&1 || failed="${failed} lint"
          pnpm run typecheck >/tmp/q-typecheck.log 2>&1 || failed="${failed} typecheck"
          # Sequential package suites; bound each Vitest worker pool as well.
          : >/tmp/q-test.log
          for package in apps/web apps/desktop; do
            (cd "$package" && pnpm run test --maxWorkers=2) \
              >>/tmp/q-test.log 2>&1 || failed="${failed} test"
          done
          for f in lint typecheck test; do
            echo "----- ${f} (tail) -----"
            tail -60 "/tmp/q-${f}.log" 2>/dev/null || true
          done
          failed="${failed# }"
          echo "QUALITY_FAILED=${failed}" >>"$GITHUB_ENV"
          if [ -n "$failed" ]; then
            echo "quality checks FAILED: ${failed} — artifacts retained; package publication eligibility=${PUBLISH_ELIGIBLE:-false}"
          else
            echo "quality checks passed"
          fi

      # Production-only alerts: artifact-only canaries receive no notification secrets.
      # QUALITY_FAILED remains shell-guarded rather than an expression condition.
      # A skipped step is indistinguishable from a step whose condition never
      # saw the variable, so an `if:` here could silently never fire and we
      # would not know until a real failure went unreported. Reading the env
      # var in bash uses the same GITHUB_ENV path that already demonstrably
      # works in this job (OKLABS_VERSION reaches the published .deb name),
      # and the step now always runs, so its log states plainly which way it
      # went.
      - name: Alert on failed quality checks
        if: env.PUBLISH_ELIGIBLE == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${QUALITY_FAILED:-}" ]; then
            echo "quality checks passed — no alert"
            exit 0
          fi
          echo "alerting: ${QUALITY_FAILED}"
          .oklabs/notify.sh high "t3code quality checks FAILED (${QUALITY_FAILED}) — .deb ${OKLABS_VERSION} IS published and installable, fix at leisure. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_NUMBER}"

      - name: Alert on failure
        if: failure() && env.CANARY != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Never assert publish state we did not observe. This step fires for
          # failures both before and after the apt upload, and the worst case —
          # .deb live, server tarball missing — is the byte-for-byte version
          # skew this file's header forbids. Report the markers, not a guess.
          if [ -n "${DEB_PUBLISHED:-}" ] && [ -n "${SERVER_PUBLISHED:-}" ]; then
            STATE=".deb and server tarball ${OKLABS_VERSION} were both published before the failure"
          elif [ -n "${DEB_PUBLISHED:-}" ]; then
            STATE="WARNING: .deb ${OKLABS_VERSION} is published but the server tarball is NOT — client/server version skew until this is fixed"
          else
            STATE="nothing was published"
          fi
          .oklabs/notify.sh urgent "t3code build FAILED — ${STATE}. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_NUMBER}"

      - name: Record job resource evidence
        if: always()
        run: |
          if command -v python3 >/dev/null && [ -f /tmp/t3-ci-helpers/ci-resource-receipt.py ]; then
            python3 /tmp/t3-ci-helpers/ci-resource-receipt.py
          else
            mkdir -p build
            printf '%s\n' '{"schema_version":1,"unavailable":"reviewed helper or Python missing before setup completed"}' \
              >build/ci-resource-receipt.json
          fi

      - name: Upload job resource evidence
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: t3-ci-resource-receipt
          path: build/ci-resource-receipt.json
          if-no-files-found: warn
          retention-days: 14
